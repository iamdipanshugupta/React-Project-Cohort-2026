<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.16),_transparent_25%),radial-gradient(circle_at_bottom_right,_rgba(236,72,153,0.18),_transparent_22%),_rgb(15_23_42)] text-white flex items-center justify-center p-4">

  <div class="relative w-full max-w-md">
    <div class="pointer-events-none absolute inset-x-0 top-0 h-48 bg-gradient-to-b from-sky-500/20 via-transparent to-transparent"></div>
    <div class="rounded-[32px] border border-white/10 bg-slate-950/95 shadow-2xl shadow-slate-950/40 backdrop-blur-xl overflow-hidden">
      <div class="p-8 sm:p-10">
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 mx-auto rounded-3xl bg-gradient-to-br from-sky-500 to-fuchsia-500 shadow-lg shadow-sky-500/25 mb-4">
            <span class="text-2xl">🔐</span>
          </div>
          <h1 class="text-4xl font-extrabold tracking-tight text-white">AuthApp</h1>
          <p class="mt-2 text-sm text-slate-400">Secure sign in with FreeAPI authentication</p>
        </div>

        <div id="auth-box" class="space-y-6">
          <div class="rounded-3xl bg-slate-900/90 p-1.5 flex gap-1 border border-white/10 mb-2">
            <button onclick="showTab('login')" id="tab-login"
              class="flex-1 rounded-2xl px-3 py-3 text-sm font-semibold transition bg-white text-slate-950 shadow-sm shadow-slate-950/10">
              Login
            </button>
            <button onclick="showTab('register')" id="tab-register"
              class="flex-1 rounded-2xl px-3 py-3 text-sm font-semibold transition text-slate-300 hover:text-white">
              Register
            </button>
          </div>

          <div id="message" class="hidden mb-4 px-4 py-3 rounded-2xl text-sm font-medium"></div>

          <form id="login-form" onsubmit="handleLogin(event)" class="rounded-3xl bg-slate-900 p-6 shadow-inner shadow-slate-950/30 space-y-4">
            <div>
              <label class="text-slate-400 text-sm mb-1 block">Username</label>
              <input id="login-username" type="text" placeholder="doejohn"
                class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition" />
            </div>
            <div>
              <label class="text-slate-400 text-sm mb-1 block">Password</label>
              <input id="login-password" type="password" placeholder="••••••••"
                class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition" />
            </div>
            <button type="submit" id="login-btn"
              class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-3 rounded-2xl transition shadow-lg shadow-sky-500/20">
              Login
            </button>
          </form>

          <form id="register-form" onsubmit="handleRegister(event)" class="hidden rounded-3xl bg-slate-900 p-6 shadow-inner shadow-slate-950/30 space-y-4">
            <div>
              <label class="text-slate-400 text-sm mb-1 block">Username</label>
              <input id="reg-username" type="text" placeholder="doejohn"
                class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition" />
            </div>
            <div>
              <label class="text-slate-400 text-sm mb-1 block">Email</label>
              <input id="reg-email" type="email" placeholder="user@email.com"
                class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition" />
            </div>
            <div>
              <label class="text-slate-400 text-sm mb-1 block">Password</label>
              <input id="reg-password" type="password" placeholder="••••••••"
                class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-4 py-3 text-sm text-white outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/20 transition" />
            </div>
            <button type="submit" id="register-btn"
              class="w-full bg-white text-slate-950 font-semibold py-3 rounded-2xl hover:bg-slate-100 transition shadow-lg shadow-slate-950/20">
              Create Account
            </button>
          </form>
        </div>
      </div>

      <div id="profile-box" class="hidden rounded-[32px] bg-slate-950/95 p-6 sm:p-8 border border-white/10 shadow-2xl shadow-slate-950/30 mt-6">
        <div class="flex items-center justify-between gap-4 mb-5">
          <div>
            <h2 class="text-2xl font-bold text-white">👤 My Profile</h2>
            <p class="text-sm text-slate-400 mt-1">Logged in user details</p>
          </div>
          <button onclick="handleLogout()" id="logout-btn"
            class="bg-gradient-to-r from-red-600 to-rose-500 hover:from-red-700 hover:to-rose-600 text-white text-sm font-semibold px-4 py-2 rounded-2xl transition shadow-lg shadow-red-500/20">
            Logout
          </button>
        </div>
        <div id="profile-loading" class="text-slate-500 text-sm">Loading profile...</div>
        <div id="user-details" class="hidden space-y-4">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full bg-slate-800 flex items-center justify-center text-2xl font-bold text-slate-100" id="user-avatar-fallback"></div>
            <div>
              <p id="user-name" class="text-lg font-semibold text-white"></p>
              <p id="user-username" class="text-sm text-slate-400"></p>
            </div>
          </div>
          <div class="grid gap-3 rounded-3xl bg-slate-900/90 border border-white/10 p-4 text-sm text-slate-300">
            <div class="flex justify-between">
              <span class="text-slate-400">Email</span>
              <span id="user-email"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Role</span>
              <span id="user-role"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Verified</span>
              <span id="user-verified"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE = "https://api.freeapi.app/api/v1/users"

    // Token localStorage mein save karo
    function saveToken(token) { localStorage.setItem("token", token) }
    function getToken() { return localStorage.getItem("token") }
    function clearToken() { localStorage.removeItem("token") }

    // Auth headers
    function authHeaders() {
      return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${getToken()}`
      }
    }

    function showTab(tab) {
      const isLogin = tab === "login"
      document.getElementById("login-form").classList.toggle("hidden", !isLogin)
      document.getElementById("register-form").classList.toggle("hidden", isLogin)
      document.getElementById("tab-login").className = `flex-1 py-2 rounded-lg text-sm font-semibold transition ${isLogin ? "bg-white text-black" : "text-zinc-400"}`
      document.getElementById("tab-register").className = `flex-1 py-2 rounded-lg text-sm font-semibold transition ${!isLogin ? "bg-white text-black" : "text-zinc-400"}`
      clearMessage()
    }

    function showMessage(text, isError = false) {
      const el = document.getElementById("message")
      el.textContent = text
      el.className = `mb-4 px-4 py-3 rounded-lg text-sm font-medium ${isError
        ? "bg-red-500/20 text-red-400 border border-red-500/30"
        : "bg-green-500/20 text-green-400 border border-green-500/30"}`
      el.classList.remove("hidden")
    }

    function clearMessage() {
      document.getElementById("message").classList.add("hidden")
    }

    function setLoading(btnId, loading, defaultText) {
      const btn = document.getElementById(btnId)
      btn.disabled = loading
      btn.textContent = loading ? "Please wait..." : defaultText
    }

    // --- Register ---
    async function handleRegister(e) {
      e.preventDefault()
      clearMessage()
      const username = document.getElementById("reg-username").value.trim()
      const email = document.getElementById("reg-email").value.trim()
      const password = document.getElementById("reg-password").value

      if (!username || !email || !password) return showMessage("All fields are required", true)

      setLoading("register-btn", true, "Create Account")
      try {
        const res = await fetch(`${BASE}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password, role: "USER" })
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data?.message ?? "Registration failed")
        showMessage("Account created! Please login.")
        showTab("login")
      } catch (err) {
        showMessage(err.message, true)
      } finally {
        setLoading("register-btn", false, "Create Account")
      }
    }

    // --- Login ---
    async function handleLogin(e) {
      e.preventDefault()
      clearMessage()
      const username = document.getElementById("login-username").value.trim()
      const password = document.getElementById("login-password").value

      if (!username || !password) return showMessage("All fields are required", true)

      setLoading("login-btn", true, "Login")
      try {
        const res = await fetch(`${BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" }, // ✅ credentials hataya
          body: JSON.stringify({ username, password })
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data?.message ?? "Login failed")

        // ✅ Token save karo
        const token = data?.data?.accessToken
        if (token) saveToken(token)

        showProfile()
      } catch (err) {
        showMessage(err.message, true)
      } finally {
        setLoading("login-btn", false, "Login")
      }
    }

    // --- Logout ---
    async function handleLogout() {
      setLoading("logout-btn", true, "Logout")
      try {
        await fetch(`${BASE}/logout`, {
          method: "POST",
          headers: authHeaders() // ✅ token bhejo
        })
      } catch (_) {}
      clearToken()
      document.getElementById("profile-box").classList.add("hidden")
      document.getElementById("auth-box").classList.remove("hidden")
      setLoading("logout-btn", false, "Logout")
    }

    // --- Profile ---
    async function showProfile() {
      document.getElementById("auth-box").classList.add("hidden")
      document.getElementById("profile-box").classList.remove("hidden")
      document.getElementById("profile-loading").classList.remove("hidden")
      document.getElementById("user-details").classList.add("hidden")

      try {
        const res = await fetch(`${BASE}/current-user`, {
          headers: authHeaders() // ✅ token bhejo
        })
        const data = await res.json()
        if (!res.ok) throw new Error("Could not fetch user")

        const user = data?.data
        document.getElementById("user-avatar-fallback").textContent = user?.username?.charAt(0).toUpperCase() ?? "U"
        document.getElementById("user-name").textContent = user?.username ?? "—"
        document.getElementById("user-username").textContent = `@${user?.username ?? ""}`
        document.getElementById("user-email").textContent = user?.email ?? "—"
        document.getElementById("user-role").textContent = user?.role ?? "—"
        document.getElementById("user-verified").textContent = user?.isEmailVerified ? "✅ Yes" : "❌ No"

        document.getElementById("profile-loading").classList.add("hidden")
        document.getElementById("user-details").classList.remove("hidden")
      } catch (err) {
        document.getElementById("profile-loading").textContent = "Failed to load profile."
      }
    }

    // --- Auto login check ---
    if (getToken()) showProfile()
  </script>
</body>
</html>
